<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d0f18">
<title>לבבות</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece2d6; --ink:#2a1a1f; --muted:#6f5b60; --panel:#fffaf2; --line:#d8c6b6;
  --felt:#6a1e2b; --felt2:#3d0f18; --rim:#2b0a11;
  --brass:#c9a24a; --brass-soft:#ecd49a;
  --card:#fbf6ea; --card-ink:#1e191b; --card-red:#b3142d; --back:#7d2232;
  --cw:clamp(52px,14.2vw,86px); --ch:calc(var(--cw)*1.42);
  --tw:clamp(48px,12.5vw,76px); --th:calc(var(--tw)*1.42);
  --serif:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --sans:"Assistant","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#14090c; --ink:#f2e7df; --muted:#b9a0a6; --panel:#22141a; --line:#3e272e; }
}
:root[data-theme="dark"]{ --bg:#14090c; --ink:#f2e7df; --muted:#b9a0a6; --panel:#22141a; --line:#3e272e; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:900px;margin:0 auto}

/* header */
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px}
.bar h1{font-family:var(--serif);font-weight:700;font-size:1.45rem;margin:0;flex:1;letter-spacing:.01em}
.bar h1 span:last-child{color:var(--card-red)}
.bar .sub{font-size:.85rem;color:var(--muted);font-weight:600}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600}
.ibtn:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* table */
.table{position:relative;margin:0 6px 6px;border-radius:28px;overflow:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 42%,var(--felt) 0%,var(--felt2) 100%);
  box-shadow:inset 0 0 0 3px var(--rim),inset 0 0 0 5px rgba(201,162,74,.55),inset 0 0 60px rgba(0,0,0,.45);
  display:grid;grid-template-columns:minmax(64px,auto) 1fr minmax(64px,auto);
  grid-template-rows:auto 1fr auto auto;grid-template-areas:"top top top" "left mid right" "me me me" "hand hand hand";
  color:#f6ead6;min-height:0}
.table::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.25) 0 1px,transparent 1px 4px)}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;z-index:1}
.seat[data-rel="2"]{grid-area:top}
.seat[data-rel="1"]{grid-area:left;justify-content:center}
.seat[data-rel="3"]{grid-area:right;justify-content:center}
.seat[data-rel="0"]{grid-area:me;flex-direction:row;justify-content:center;padding:4px 6px 2px}
.plate{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 6px;border-radius:999px;
  background:rgba(20,4,8,.45);border:1px solid rgba(236,212,154,.18);transition:box-shadow .25s,border-color .25s}
.seat.turn .plate{border-color:var(--brass);box-shadow:0 0 0 2px rgba(201,162,74,.35),0 0 18px rgba(236,212,154,.35)}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;
  background:var(--brass);color:#2b0a11;flex:none}
.seat.offline .av{background:#7a6a6a}
.who{display:flex;flex-direction:column;line-height:1.1}
.who b{font-size:.92rem;font-weight:700;white-space:nowrap;max-width:9.5em;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:.75rem;opacity:.8;white-space:nowrap}
.score{font-family:var(--serif);font-weight:700;font-size:1.15rem;min-width:1.6em;text-align:center;color:var(--brass-soft)}
.tags{display:flex;gap:4px;align-items:center;font-size:.72rem;min-height:18px}
.tag{padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.35);white-space:nowrap}
.tag.pts{color:#ffd0d6}.tag.ok{color:#cfe8b8}.tag.off{color:#ffb4a8}
.stack{position:relative;width:calc(var(--tw)*.62);height:calc(var(--tw)*.88)}
.stack .back{position:absolute;inset:0;border-radius:6px}
.stack .back:nth-child(2){transform:translate(3px,-3px)}
.stack .back:nth-child(3){transform:translate(6px,-6px)}
.stack .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-weight:700;
  font-size:1rem;color:var(--brass-soft);z-index:3;text-shadow:0 1px 2px #000;transform:translate(6px,-6px)}
.seat[data-rel="1"] .plate,.seat[data-rel="3"] .plate{flex-direction:column;border-radius:16px;padding:6px 8px;gap:3px}
.seat[data-rel="1"] .who,.seat[data-rel="3"] .who{align-items:center;text-align:center}

/* center */
.mid{grid-area:mid;display:grid;place-items:center;position:relative;z-index:1;min-height:0}
.trick{position:relative;width:min(100%,calc(var(--tw)*3.6));aspect-ratio:1/1;max-height:100%}
.status{position:absolute;inset:auto 0 50% 0;transform:translateY(50%);text-align:center;padding:0 8px;
  font-size:.98rem;font-weight:600;pointer-events:none;transition:opacity .2s;text-wrap:balance}
.status .arrow{display:block;font-size:2.2rem;line-height:1;color:var(--brass-soft);margin-bottom:4px}
.trick.busy + .status{opacity:0}
.trick .tcard{position:absolute;left:50%;top:50%;width:var(--tw);height:var(--th);margin:calc(var(--th)/-2) 0 0 calc(var(--tw)/-2);
  transition:transform .38s cubic-bezier(.2,.8,.25,1),opacity .38s;will-change:transform}
.tcard.win{box-shadow:0 0 0 2px var(--brass),0 6px 18px rgba(0,0,0,.45)}

/* cards */
.card{position:relative;background:var(--card);color:var(--card-ink);border-radius:9%/6.5%;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 3px 8px rgba(0,0,0,.35);font-family:var(--serif);overflow:hidden}
.card.red{color:var(--card-red)}
.card .idx{position:absolute;top:5%;left:7%;display:flex;flex-direction:column;align-items:center;line-height:.9}
.card .idx b{font-size:calc(var(--sz)*.27);font-weight:700}
.card .idx i{font-style:normal;font-size:calc(var(--sz)*.22)}
.card .idx.flip{top:auto;left:auto;bottom:5%;right:7%;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--sz)*.5)}
.card.court .pip{flex-direction:column;inset:18% 16%;border:1px solid currentColor;border-radius:5px;opacity:.95;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--sz)*.26);gap:0}
.card.court .pip em{font-style:normal;font-weight:700;font-size:calc(var(--sz)*.42);line-height:1}
.card[data-id="S12"] .pip{background:linear-gradient(transparent,rgba(179,20,45,.08))}
.back{background:var(--back);border-radius:9%/6.5%;box-shadow:0 2px 6px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(45deg,rgba(236,212,154,.28) 0 1.5px,transparent 1.5px 7px),
  repeating-linear-gradient(-45deg,rgba(236,212,154,.28) 0 1.5px,transparent 1.5px 7px);
  outline:2px solid rgba(251,246,234,.85);outline-offset:-4px}
.tcard{--sz:var(--tw)}

/* hand */
.handzone{grid-area:hand;position:relative;z-index:2;padding:6px 10px 12px}
.hand{position:relative;height:calc(var(--ch) + 22px);direction:ltr}
.hand .card{--sz:var(--cw);position:absolute;bottom:0;width:var(--cw);height:var(--ch);
  transition:transform .18s ease,filter .18s,left .25s ease;cursor:pointer;touch-action:manipulation}
.hand .card.sel{transform:translateY(-20px);box-shadow:0 0 0 2.5px var(--brass),0 8px 16px rgba(0,0,0,.45)}
.hand .card.got{transform:translateY(-20px);box-shadow:0 0 0 2.5px var(--brass),0 8px 16px rgba(0,0,0,.45)}
.hand .card.dim{filter:brightness(.55) saturate(.6);cursor:default}
.hand .card.new::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--brass);box-shadow:0 0 0 2px var(--card)}
@media (hover:hover){.hand.can .card:not(.dim):not(.sel):hover{transform:translateY(-8px)}}
.actions{display:flex;justify-content:center;gap:8px;min-height:0}
.btn{border:0;border-radius:999px;padding:10px 22px;font-weight:700;font-size:1rem;background:var(--brass);color:#2b0a11;
  box-shadow:0 3px 0 #8e6f2a}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;box-shadow:none}
.actions .btn{margin-top:6px}

/* bubbles */
.bubble{position:absolute;z-index:20;font-size:1.8rem;pointer-events:none;animation:pop 2.4s ease forwards;
  left:50%;top:-6px;transform:translateX(-50%)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}12%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}
  20%{transform:translate(-50%,-4px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,2,5,.55);display:grid;place-items:center;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:20px;width:min(440px,100%);max-height:100%;overflow:auto;
  padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4);border:1px solid var(--line)}
.sheet h2{font-family:var(--serif);font-size:1.5rem;margin:0 0 4px}
.sheet p{margin:.3em 0 .8em;color:var(--muted);line-height:1.5}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;margin-top:14px}
.sheet .btn.ghost{color:var(--ink);border-color:var(--line)}
.tbl-wrap{overflow-x:auto}
table.sc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.sc th,table.sc td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.sc th{font-size:.85rem;color:var(--muted);font-weight:700}
table.sc td.n{text-align:start;font-weight:700}
table.sc tr.tot td{font-family:var(--serif);font-weight:700;font-size:1.15rem;border-bottom:0}
table.sc .best{color:var(--card-red)}
.minitrick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.minitrick figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.minitrick .card{--sz:58px;width:58px;height:82px}
.minitrick figure.w .card{box-shadow:0 0 0 2.5px var(--brass)}
.menu-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu-list .btn{width:100%}
.rules{line-height:1.6;color:var(--ink)}
.rules li{margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input{font:inherit;font-size:1.05rem;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field input.code{letter-spacing:.3em;text-transform:uppercase;font-weight:700;text-align:center;direction:ltr}
.err{color:var(--card-red);font-weight:600;min-height:1.2em;margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-height:760px) and (min-width:600px){:root{--cw:clamp(60px,9vw,92px)}}
.sheet h3{font-family:var(--serif);font-size:1.1rem;margin:18px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--serif);font-size:1.45rem;font-weight:700;color:var(--card-red);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);line-height:1.25}
tr.clk{cursor:pointer}
tr.clk:hover td{background:rgba(201,162,74,.12)}
.sheet .row .btn{flex:1 1 auto}

.rv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rv:last-of-type{border-bottom:0}
.rv-h{font-size:.92rem;color:var(--muted);line-height:1.3}
.rv-h b{display:block;color:var(--ink);font-size:1rem}
.rv-c{display:flex;gap:5px;flex:none;direction:ltr}
.rv-c .card{--sz:46px;width:46px;height:65px}
.rv.me .rv-c .card{box-shadow:0 0 0 2px var(--brass),0 3px 8px rgba(0,0,0,.3)}

.status .claim{display:inline-flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;border-radius:18px;
  background:rgba(25,5,10,.88);border:2px solid var(--brass);box-shadow:0 10px 30px rgba(0,0,0,.5);
  font-size:1.12rem;line-height:1.35;animation:claimIn .35s ease-out}
.status .claim small{font-size:.95rem;color:var(--brass-soft)}
.claim-cards{display:flex;justify-content:center;direction:ltr}
.claim-cards .card{--sz:40px;width:40px;height:57px;margin-left:-12px}
.claim-cards .card:first-child{margin-left:0}
@keyframes claimIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.status .claim small.claim-foot{color:#f6ead6;opacity:.85;font-size:.88rem}

</style>

const UI = (() => {

const Common = (() => {
  const ARROWS = { 1: '←', 2: '↑', 3: '→' };
  function statusFor(st, mySeat, names, extra = {}) {
    const rel = s => (s - mySeat + 4) % 4;

      const tg = Hearts.passTarget(mySeat, st.passDir);
      if (!st.passDone[mySeat]) return { center: `<span class="arrow">${ARROWS[rel(tg)]}</span>${I18N.t('choosePass', UI.esc(names[tg]))}`, mine: I18N.t('choosingNote') };

      return { center: `<span class="arrow">${ARROWS[rel(tg)]}</span>${I18N.t('waitingFor', UI.esc(wait.join(', ')))}`, mine: I18N.t('passedNote') };
    }
    if (st.phase === 'playing' && st.claiming != null) {
      const left = 13 - st.tricksPlayed, pts = (st.claimPts != null ? st.claimPts : null);
      const moon = st.claimType === 'moon';
      const msg = (moon
        ? (st.claiming === mySeat ? I18N.t('claimMoonYou') : I18N.t('claimMoonOther', UI.esc(names[st.claiming])))
        : (st.claiming === mySeat ? I18N.t('claimYou', left) : I18N.t('claimOther', UI.esc(names[st.claiming]), left))) +
        (pts != null ? `<br><small>${pts ? I18N.t('plusPts', pts) : I18N.t('noMorePts')}</small>` : '');
      const cards = (st.claimCards || []).map(UI.cardHTML).join('');
      const ack = st.claimAck || [];
      const wait = [0, 1, 2, 3].filter(s => !ack[s] && s !== mySeat).map(s => UI.esc(names[s]));
      const foot = !ack[mySeat] ? I18N.t('pressOk') : (wait.length ? I18N.t('waitConfirm', wait.join(', ')) : '');
      return { center: `<div class="claim"><div>${msg}</div>${cards ? `<div class="claim-cards">${cards}</div>` : ''}${foot ? `<small class="claim-foot">${foot}</small>` : ''}</div>`, mine: st.claiming === mySeat ? I18N.t(moon ? 'allPointsYours' : 'allYours') : '' };
    }
    if (st.phase === 'playing') {
      if (st.turn === mySeat) {
        let c = I18N.t(st.trick.length ? 'yourTurn' : (st.tricksPlayed === 0 ? 'leadC2' : 'yourLead'));
        if (extra.armed) c = I18N.t('tapAgain');
        return { center: c, mine: c };
      }
      return { center: I18N.t('turnOf', UI.esc(names[st.turn])), mine: '' };
    }
    if (st.phase === 'trickEnd') return { center: '', mine: '' };
    return { center: '', mine: '' };
  }

      const w = st.winners || [];
      title = w.includes(mySeat) ? I18N.t(w.length > 1 ? 'tieFirst' : 'youWon') : I18N.t('wonBy', w.map(i => names[i]).join(I18N.t('and')));
    } else title = I18N.t('handOver', st.handNum + 1);
    const cl = st.claimed && st.claimed.seat != null
      ? `<p>${st.claimed.kind === 'moon'
        ? (st.claimed.seat === mySeat ? I18N.t('claimedMoonYou') : I18N.t('claimedMoonOther', UI.esc(names[st.claimed.seat])))
        : (st.claimed.seat === mySeat ? I18N.t('claimedYou', st.claimed.tricks) : I18N.t('claimedOther', UI.esc(names[st.claimed.seat]), st.claimed.tricks))}</p>` : '';
    const moon = st.moon != null ? `<p>${st.moon === mySeat ? I18N.t('moonYou') : I18N.t('moon', UI.esc(names[st.moon]))}</p>` : '';
    const min = Math.min(...st.scores);
    const rows = [0, 1, 2, 3].map(s => `<tr><td class="n">${UI.esc(names[s])}${s === mySeat && !I18N.isMeName(names[s]) ? I18N.t('me') : ''}</td><td dir="ltr">+${st.handDelta[s]}</td><td class="${st.scores[s] === min ? 'best' : ''}" style="font-family:var(--serif);font-weight:700">${st.scores[s]}</td></tr>`).join('');
    return `<h2>${UI.esc(title)}</h2>${cl}${moon}
      <div class="tbl-wrap"><table class="sc"><thead><tr><th style="text-align:start">${I18N.t('colPlayer')}</th><th>${I18N.t('colThis')}</th><th>${I18N.t('colTotal')}</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${isOver ? '' : `<p>${I18N.t('nextHand', I18N.t('dirs')[(st.handNum + 1) % 4])}</p>`}`;
  }
  return { statusFor, handEndHTML };
})();

/* ===== Version 1: you vs three computer players ===== */
(() => {
  const KEY = 'hearts-solo-v1', NAMES_KEY = 'hearts-solo-names', ARCH_KEY = 'hearts-solo-archive';
  const SPEED = { bot: 700, trick: 4300 };
  let g = null, sel = new Set(), armed = null, timer = null;

  const lsGet = (k, d) => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const save = () => lsSet(KEY, g);
  const namesKey = () => NAMES_KEY + '-' + I18N.lang;
  const names = () => {
    let n = lsGet(namesKey(), null);
    if (!n && I18N.lang === 'he') n = lsGet(NAMES_KEY, null); // names saved before languages existed
    return Array.isArray(n) && n.length === 4 ? n : I18N.defaultNames();
  };
  const t = I18N.t;
  const archive = () => lsGet(ARCH_KEY, []);
  const esc = UI.esc;

  function newGame() {
    UI.closeModal();
    g = Hearts.newGame(names()); g.started = Date.now(); g.handInfo = [];
    Hearts.startHand(g); sel.clear(); armed = null; step();
  }
  function step() {
    if (g.phase === 'passing') for (let s = 1; s < 4; s++) if (!g.passDone[s]) Hearts.setPass(g, s, Bot.choosePass(g.hands[s]));
    if (g.phase === 'gameOver' && !g.archived) archiveGame();
    save(); draw(); schedule();
  }
  function archiveGame() {
    const list = archive();
    list.push({
      id: g.started || Date.now(), date: Date.now(), names: g.names.slice(), scores: g.scores.slice(),
      history: g.history.map(h => h.slice()), winners: g.winners.slice(), handInfo: (g.handInfo || []).slice(),
    });
    g.archived = true;
    if (!lsSet(ARCH_KEY, list)) { list.splice(0, Math.floor(list.length / 4)); lsSet(ARCH_KEY, list); }
  }
  function schedule() {
    clearTimeout(timer);
    if (g.passReveal) return;
    else if (g.phase === 'trickEnd') timer = setTimeout(collect, SPEED.trick);
    else if (g.claiming != null) { /* waiting for your confirmation */ }
    else if (Hearts.claimant(g) >= 0) { Hearts.startClaim(g, s => s !== 0); step(); }
    else if (Hearts.canFinish(g) && !g.playOut) askFinish();
    else if (g.phase === 'playing' && g.turn !== 0)
      timer = setTimeout(() => { Hearts.playCard(g, g.turn, Bot.choosePlay(g, g.turn)); step(); }, SPEED.bot);
    else if (g.phase === 'handEnd' || g.phase === 'gameOver') timer = setTimeout(showHandEnd, 500);
  }
  function collect() { clearTimeout(timer); if (Hearts.collectTrick(g)) step(); }
  function askFinish() {
    UI.modal('finish', `<h2>${t('allTakenH')}</h2><p>${t('allTakenP')}</p>`, [
      { label: t('finishHand'), onClick: () => { UI.closeModal(); Hearts.finishHand(g); step(); } },
      { label: t('keepPlaying'), ghost: true, onClick: () => { UI.closeModal(); g.playOut = true; step(); } }]);
  }
  function draw() {
    const N = g.names;
    const myTurn = g.phase === 'playing' && g.turn === 0;
    const passing = g.phase === 'passing' && !g.passDone[0];
    if (g.claiming != null) {
      g.claimPts = g.hands.flat().reduce((a, c) => a + Hearts.pts(c), 0);
      g.claimCards = Hearts.sortHand(g.hands[g.claiming]);
    }
    const st = Common.statusFor(g, 0, N, { armed: myTurn && armed });
    UI.render({
      mySeat: 0, sub: t('handN', g.handNum + 1),
      players: N.map((n, s) => ({ name: n, bot: s > 0, note: s === 0 ? st.mine : t('computer') })),
      scores: g.scores, taken: g.taken, counts: g.hands.map(h => h.length),
      phase: g.phase, turn: g.turn, passDone: g.passDone,
      trick: g.trick, trickWinner: g.trickWinner,
      hand: g.hands[0], raised: g.passReveal ? g.received[0] : [], legal: myTurn ? Hearts.legalFor(g, 0) : null,
      selected: passing ? [...sel] : (armed ? [armed] : []),
      received: g.tricksPlayed === 0 ? g.received[0] : [],
      interactive: passing || myTurn,
      status: g.passReveal ? t('gotCards', esc(N[[3, 1, 2, 0][g.passDir]])) : (g.trick.length ? '' : st.center),
      actions: passing ? [{ key: 'pass', label: t('passBtn', sel.size), disabled: sel.size !== 3 }]
        : g.passReveal ? [{ key: 'revealOk', label: t('cont') }]
        : g.claiming != null && g.claimAck && !g.claimAck[0] ? [{ key: 'claimOk', label: t('ok') }] : [],
    });
  }
  function onCard(id) {
    if (g.phase === 'passing' && !g.passDone[0]) {
      if (sel.has(id)) sel.delete(id); else if (sel.size < 3) sel.add(id);
      return draw();
    }
    if (g.phase === 'playing' && g.turn === 0 && Hearts.legalFor(g, 0).includes(id)) {
      if (armed === id) { armed = null; Hearts.playCard(g, 0, id); step(); }
      else { armed = id; draw(); }
    }
  }
  function onAction(k) {
    if (k === 'pass' && sel.size === 3) {
      Hearts.setPass(g, 0, [...sel]); sel.clear();
      if (g.phase === 'playing') g.passReveal = true;
      step();
    }
    if (k === 'revealOk') { g.passReveal = false; step(); }
    if (k === 'claimOk') { Hearts.ackClaim(g, 0); step(); }
  }
  function showHandEnd() {
    if (g.phase === 'gameOver') {
      UI.modal('end', Common.handEndHTML(g, g.names, 0) + UI.scoreTable(g.names, g.history, g.scores, 0) +
        `<p>${t('savedStats')}</p>`,
        [{ label: t('newGame'), onClick: newGame }, { label: t('stats'), ghost: true, onClick: showStats }]);
    } else if (g.phase === 'handEnd') {
      UI.modal('end', Common.handEndHTML(g, g.names, 0), [{ label: t('nextHandBtn'), onClick: () => {
        UI.closeModal(); for (let s = 0; s < 4; s++) Hearts.setReady(g, s); step(); } }]);
    }
  }

  /* ---------- names ---------- */
  function editNames() {
    const cur = g.names;
    const labels = t('seatLabels');
    const sheet = UI.modal('names', `<h2>${t('namesH')}</h2>
      ${cur.map((n, i) => `<div class="field"><label for="pn${i}">${labels[i]}</label><input id="pn${i}" maxlength="12" value="${esc(n)}"></div>`).join('')}
      <div class="err" id="nerr"></div>`, [
      { label: t('save'), onClick: () => {
        const v = [0, 1, 2, 3].map(i => sheet.querySelector('#pn' + i).value.trim());
        if (v.some(x => !x)) { sheet.querySelector('#nerr').textContent = t('needName'); return; }
        lsSet(namesKey(), v); g.names = v; save(); UI.closeModal(); draw();
      } },
      { label: t('defaultNames'), ghost: true, onClick: () => I18N.defaultNames().forEach((n, i) => { sheet.querySelector('#pn' + i).value = n; }) },
      { label: t('cancel'), ghost: true, close: true }]);
  }

  /* ---------- statistics ---------- */
  function stats(list) {
    const S = { games: list.length, wins: 0, ties: 0, finals: [], hands: 0, myPts: 0, moonMe: 0, moonOther: 0,
      qsMe: 0, qsHands: 0, zeroHands: 0, seat: [0, 1, 2, 3].map(() => ({ wins: 0, total: 0 })), streak: 0, bestStreak: 0 };
    let run = 0;
    list.forEach(a => {
      const won = a.winners.includes(0);
      if (won) { S.wins++; if (a.winners.length > 1) S.ties++; }
      run = won ? run + 1 : 0; S.bestStreak = Math.max(S.bestStreak, run);
      S.finals.push(a.scores[0]);
      a.history.forEach(h => { S.hands++; S.myPts += h[0]; if (h[0] === 0) S.zeroHands++; });
      (a.handInfo || []).forEach(x => {
        if (x.moon === 0) S.moonMe++; else if (x.moon != null) S.moonOther++;
        if (x.qs != null) { S.qsHands++; if (x.qs === 0) S.qsMe++; }
      });
      a.winners.forEach(w => S.seat[w].wins++);
      a.scores.forEach((x, i) => { S.seat[i].total += x; });
    });
    S.streak = run;
    return S;
  }
  const pct = (a, b) => (b ? Math.round(100 * a / b) + '%' : '—');
  const avg = (a, b) => (b ? (a / b).toFixed(1) : '—');
  const fmtDate = d => new Date(d).toLocaleDateString(I18N.locale(), { day: 'numeric', month: 'numeric', year: '2-digit' }) +
    ' ' + new Date(d).toLocaleTimeString(I18N.locale(), { hour: '2-digit', minute: '2-digit' });
  const aNames = a => a.names.map(I18N.mapName);

  function showStats() {
    const list = archive();
    if (!list.length) {
      return UI.modal('stats', `<h2>${t('stats')}</h2><p>${t('noGames')}</p>`,
        [{ label: t('importBackup'), ghost: true, onClick: importData }, { label: t('close'), close: true }]);
    }
    const S = stats(list);
    const N = names();
    const tile = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const recent = list.slice().reverse().slice(0, 30).map((a, k) => {
      const i = list.length - 1 - k;
      const won = a.winners.includes(0);
      return `<tr data-g="${i}" class="clk"><td class="n">${fmtDate(a.date)}</td><td>${won ? '🏆' : esc(a.winners.map(w => aNames(a)[w]).join(', '))}</td><td>${a.scores[0]}</td><td>${a.history.length}</td></tr>`;
    }).join('');
    const sheet = UI.modal('stats', `<h2>${t('stats')}</h2>
      <div class="stats">
        ${tile(S.games, t('tGames'))}${tile(S.wins, t('tWins'))}${tile(pct(S.wins, S.games), t('tWinPct'))}
        ${tile(Math.min(...S.finals), t('tBest'))}${tile(avg(S.finals.reduce((a, b) => a + b, 0), S.games), t('tAvgFinal'))}${tile(avg(S.myPts, S.hands), t('tAvgHand'))}
        ${tile(pct(S.zeroHands, S.hands), t('tZero'))}${tile(pct(S.qsMe, S.qsHands), t('tQs'))}${tile(S.moonMe, t('tMoonMe'))}
        ${tile(S.moonOther, t('tMoonOther'))}${tile(S.streak, t('tStreak'))}${tile(S.bestStreak, t('tBestStreak'))}
      </div>
      <h3>${t('bySeat')}</h3>
      <div class="tbl-wrap"><table class="sc"><thead><tr><th style="text-align:start">${t('colPlayer')}</th><th>${t('colWins')}</th><th>${t('colAvgFinal')}</th></tr></thead><tbody>
        ${S.seat.map((x, i) => `<tr><td class="n">${esc(N[i])}</td><td>${x.wins}</td><td>${avg(x.total, S.games)}</td></tr>`).join('')}
      </tbody></table></div>
      <h3>${t('recent')}</h3><p>${t('tapGame')}</p>
      <div class="tbl-wrap"><table class="sc"><thead><tr><th style="text-align:start">${t('colDate')}</th><th>${t('colWinner')}</th><th>${t('colMyScore')}</th><th>${t('colHands')}</th></tr></thead><tbody>${recent}</tbody></table></div>`,
      [{ label: t('exportBtn'), ghost: true, onClick: exportData },
       { label: t('importBackup'), ghost: true, onClick: importData },
       { label: t('deleteAll'), ghost: true, onClick: () => UI.modal('confirm', `<h2>${t('deleteQ')}</h2><p>${t('deleteP')}</p>`,
          [{ label: t('del'), onClick: () => { lsSet(ARCH_KEY, []); showStats(); } }, { label: t('cancel'), ghost: true, onClick: showStats }]) },
       { label: t('close'), close: true }]);
    sheet.querySelectorAll('tr[data-g]').forEach(tr => tr.onclick = () => {
      const a = list[+tr.dataset.g];
      UI.modal('game', `<h2>${t('gameFrom', fmtDate(a.date))}</h2>` + UI.scoreTable(aNames(a), a.history, a.scores, 0),
        [{ label: t('back'), onClick: showStats }, { label: t('close'), ghost: true, close: true }]);
    });
  }
  function exportData() {
    const data = JSON.stringify({ app: 'hearts-solo', version: 1, names: names(), archive: archive() });
    const name = 'hearts-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {}
    UI.modal('export', `<h2>${t('backupH')}</h2><p>${t('backupP')}</p>
      <div class="field"><textarea readonly rows="5" dir="ltr" style="font:12px monospace;border-radius:12px;padding:8px;width:100%" onclick="this.select()">${esc(data)}</textarea></div>`,
      [{ label: t('copy'), ghost: true, onClick: () => { navigator.clipboard && navigator.clipboard.writeText(data); } },
       { label: t('back'), onClick: showStats }]);
  }
  function importData() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = async () => {
      try {
        const d = JSON.parse(await inp.files[0].text());
        if (d.app !== 'hearts-solo' || !Array.isArray(d.archive)) throw 0;
        const cur = archive(), ids = new Set(cur.map(a => a.id));
        const add = d.archive.filter(a => a && Array.isArray(a.scores) && !ids.has(a.id));
        lsSet(ARCH_KEY, cur.concat(add).sort((a, b) => a.date - b.date));
        UI.modal('imp', `<h2>${t('importedH')}</h2><p>${t('importedP', add.length)}</p>`, [{ label: t('toStats'), onClick: showStats }]);
      } catch (e) {
        UI.modal('imp', `<h2>${t('importFailH')}</h2><p>${t('importFailP')}</p>`, [{ label: t('close'), close: true }]);
      }
    };
    inp.click();
  }

  function menu() {
    UI.modal('menu', `<h2>${t('menu')}</h2>`, [
      { label: '🌐 ' + t('langBtn'), ghost: true, onClick: switchLang },
      { label: t('stats'), ghost: true, onClick: showStats },
      { label: t('namesH'), ghost: true, onClick: editNames },
      { label: t('rulesBtn'), ghost: true, onClick: () => UI.modal('rules', `<h2>${t('rulesH')}</h2>` + t('rules'), [{ label: t('close'), close: true }]) },
      { label: t('newGame'), ghost: true, onClick: () => UI.modal('confirm', `<h2>${t('newGameQ')}</h2><p>${t('newGameP')}</p>`,
          [{ label: t('yesNew'), onClick: newGame }, { label: t('cancel'), ghost: true, close: true }]) },
      { label: t('close'), close: true },
    ]);
  }
  function switchLang() {
    UI.closeModal();
    I18N.setLang(I18N.other());
    g.names = names(); save();
    UI.applyLang(); draw();
    if (g.phase === 'handEnd' || g.phase === 'gameOver') showHandEnd();
    else if (Hearts.canFinish(g) && !g.playOut) askFinish();
  }
  UI.mount({
    card: onCard, action: onAction, menu,
    table: () => { if (g.phase === 'trickEnd') collect(); },
    scores: () => UI.modal('scores', `<h2>${t('scoresH')}</h2>` + (g.history.length ? UI.scoreTable(g.names, g.history, g.scores, 0) : `<p>${t('noHands')}</p>`), [{ label: t('close'), close: true }]),
    last: () => UI.modal('last', `<h2>${t('lastTrickH')}</h2>` + UI.trickHTML(g.lastTrick, g.names), [{ label: t('close'), close: true }]),
  });
  const saved = lsGet(KEY, null);
  if (saved && saved.hands && saved.phase !== 'lobby') {
    g = saved; if (!g.names) g.names = names();
    if (g.claiming != null && !g.claimAck) g.claimAck = [false, true, true, true];
    step();
  } else newGame();
})();

</script>
